# config.d/config.yaml
database:
  user: SpamVanquisher
  password: change_me
  host: localhost
  database: SpamVanquisherDB
  port: 3306

accounts:
   - provider: gmail
     email: yourname@gmail.com
     password: "your_regular_password_or_app_password"   
     imap_server: imap.gmail.com
     imap_port: 993
     smtp_server: smtp.gmail.com
     smtp<｜begin▁of▁sentence｜>port: 587
   - provider: hotmail
     email: yourname@hotmail.com
     password: "your_regular_password_or_app_password"   
     imap_server: outlook.office365.com
     imap_port: 993
     smtp_server: smtp-mail.outlook.com
     smtp_port: 587

Folders:
  inbox: INBOX
  spam_folder: SPAM
  ham_folder: HAM
  unsorted: UNSORTED
  infected_folder: INFECTED
  spam_learn: SPAM_LEARN
  ham_learn: HAM_LEARN

DaemonSettings:
  data_path: /var/lib/spamvanquisher/data
  scan_time: 300
  batch_size: 100

EmailParts:
  use_subject: true
  use_sender: true
  use_recipient: false
  use_body: true

MySQL:
  user: SpamVanquisher
  host: localhost
  database: SpamVanquisherDB
  password: change_me
  port: 3306

Logging:
  log_path: logs/SpamVanquisher.log
  backup_count: 4
  check_interval: 300
  max_size: 2g
