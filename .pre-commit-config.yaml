  # Auto-fix hooks first
  - repo: https://github.com/ikamensh/flynt
    rev: 1.0.6
    hooks:
      - id: flynt
        name: Normalize non-logging strings to f-strings
        entry: flynt
        language: python
        language_version: python3.13
        types: [python]
        args:
          - --exclude=.venv
          - --exclude='.*log\.(debug|info|warning|error|critical).*'

  - repo: https://github.com/pre-commit/mirrors-isort
    rev: v5.10.1
    hooks:
      - id: isort
        language_version: python3.13
        exclude: ^\.venv/
        args:
          - --line-length=120
          - --multi-line=3
          - --trailing-comma
          - --use-parentheses
          - --force-grid-wrap=0

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3.13
        exclude: ^\.venv/
        args:
          - --line-length=120
          - --skip-string-normalization
          - --skip-magic-trailing-comma

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files

  # Local auto-commit fixes hook
  - repo: local
    hooks:
      - id: auto-commit-fixes
        name: Auto-commit formatting/sorting fixes
        entry: hooks/auto_commit_fixes.sh
        language: system
        pass_filenames: false
        always_run: true

  # Blocking hooks
  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        language_version: python3.13
        exclude: ^\.venv/
        args:
          - --max-line-length=120
          - --extend-ignore=E501,E203

  - repo: https://github.com/pre-commit/mirrors-pylint
    rev: v2.7.4
    hooks:
      - id: pylint
        name: Run pylint
        entry: pylint
        language: python
        language_version: python3.13
        types: [python]
        exclude: ^\.venv/
        args: [--rcfile=.pylintrc, --disable=line-too-long]
        additional_dependencies:
          - requests
          - beautifulsoup4
          - pyyaml

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        language_version: python3.13
        args: ['--baseline', '.secrets.baseline']


  # Tests run last
  - repo: local
    hooks:
      - id: lazy-format
        name: Fix logging f-strings
        entry: python hooks/lazy_format.py
        language: python
        language_version: python3.13
        files: \.py$
        additional_dependencies:
          - libcst
      - id: pylint-todo
        name: Append pylint FIXME comments
        entry: hooks/pylint_todo.py
        language: system
        pass_filenames: true
        always_run: true

      - id: pytest
        name: Run unit tests
        entry: pytest
        language: python
        pass_filenames: false
        types: [python]
        args: [--maxfail=1, --disable-warnings, --exit-zero]
        language_version: python3.13
        additional_dependencies:
          - pytest
          - requests
          - beautifulsoup4
          - pyyaml
